name: Publish

# Stages each release on npm through trusted publishing (OIDC): no npm token exists anywhere,
# and npm attaches provenance on its own. Two approvals stand between a `v*` tag and a public
# version: the `npm-publish` environment holds this run until the owner approves it, and the
# staged version only goes public once a maintainer approves it with 2FA, on npmjs.com
# (Staged Packages) or with `npm stage approve <stage-id>`. The trusted publisher on npm allows
# `npm stage publish` only, so this workflow cannot publish directly.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm >= 11.15.0 and Node >= 22.14.0; the npm bundled with Node 24
      # can be older (24.15.0 ships 11.12.1). Pinned, because this job holds publish rights.
      - run: npm install -g npm@11.21.0
      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      # prepublishOnly runs typecheck, unit tests and build before staging.
      - run: npm stage publish .
